<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel de Administración - Mi Blog{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <!-- Logo -->
                <div class="flex items-center">
                    <a href="{% url 'blog:dashboard' %}" class="text-2xl font-bold text-gray-900 hover:text-orange-600 transition-colors">
                        <i class="fas fa-cog mr-2"></i>Panel Admin
                    </a>
                </div>
                
                <!-- Navegación -->
                <nav class="hidden md:flex space-x-8">
                    <a href="{% url 'blog:dashboard' %}" class="text-gray-700 hover:text-orange-600 transition-colors">
                        <i class="fas fa-tachometer-alt mr-1"></i>Dashboard
                    </a>
                    <a href="{% url 'blog:admin_posts' %}" class="text-gray-700 hover:text-orange-600 transition-colors">
                        <i class="fas fa-newspaper mr-1"></i>Posts
                    </a>
                    <a href="{% url 'blog:admin_categorias' %}" class="text-gray-700 hover:text-orange-600 transition-colors">
                        <i class="fas fa-tags mr-1"></i>Categorías
                    </a>
                    <a href="{% url 'blog:lista_posts' %}" class="text-gray-700 hover:text-orange-600 transition-colors" target="_blank">
                        <i class="fas fa-external-link-alt mr-1"></i>Ver Blog
                    </a>
                </nav>
                
                <!-- Usuario -->
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-600">
                        <i class="fas fa-user mr-1"></i>{{ user.username }}
                    </span>
                    <a href="/admin/logout/" class="text-gray-600 hover:text-orange-600 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Mensajes -->
    {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} bg-{% if message.tags == 'success' %}green{% elif message.tags == 'error' %}red{% elif message.tags == 'warning' %}yellow{% else %}orange{% endif %}-100 border border-{% if message.tags == 'success' %}green{% elif message.tags == 'error' %}red{% elif message.tags == 'warning' %}yellow{% else %}orange{% endif %}-400 text-{% if message.tags == 'success' %}green{% elif message.tags == 'error' %}red{% elif message.tags == 'warning' %}yellow{% else %}orange{% endif %}-700 px-4 py-3 rounded mb-4">
            <div class="flex items-center">
                <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-circle{% elif message.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %} mr-2"></i>
                {{ message }}
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Contenido principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- JavaScript -->
    <script>
        // Confirmar eliminación
        function confirmarEliminacion(mensaje) {
            return confirm(mensaje || '¿Estás seguro de que quieres eliminar este elemento?');
        }
        
        // Auto-generar slug desde el título
        document.addEventListener('DOMContentLoaded', function() {
            const tituloInput = document.getElementById('id_titulo');
            const slugInput = document.getElementById('id_slug');
            
            if (tituloInput && slugInput) {
                tituloInput.addEventListener('input', function() {
                    if (!slugInput.value) {
                        const slug = this.value
                            .toLowerCase()
                            .replace(/[^a-z0-9\s-]/g, '')
                            .replace(/\s+/g, '-')
                            .replace(/-+/g, '-')
                            .trim('-');
                        slugInput.value = slug;
                    }
                });
            }
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
